# Continuous integration — every push to main and every PR must keep all
# gates green (CONSTITUTION Rules 8, 11, 12, 13).
#
# Unlike a plain rustup CI, this one runs *inside the flake*. That is not
# ceremony: Rule 13 makes nixpkgs authoritative for the `wasm-bindgen-cli`
# version, so a CI that installed its own toolchain would be checking a
# different pair than the one developers and the release build actually use —
# and the check that matters most would be the one that means nothing.
#
# One job rather than five: the Nix setup dominates the cost for a workspace
# this small, so it is paid once. Granularity is preserved through steps —
# GitHub reports which gate failed.
#
# `--locked` everywhere: CI builds exactly what Cargo.lock records, so a
# drifted lockfile fails loudly instead of resolving silently.
name: CI

on:
  push:
    branches: [main]
    # A release is an annotated `vX.Y.Z` tag (Rule 12), and it is the only
    # thing that publishes a non-`-dev` add-on image. Every gate runs on it
    # too: a release that skipped the tests would be the one release nobody
    # checked.
    tags: ['v*']
  pull_request:
  # Manual, and it exists for one job: `apk` builds the Android artifact on
  # demand so a phone can be given a build without cutting a release.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: fmt · clippy · tests · wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Caches ~/.cargo and target/. The Nix store itself is not cached here;
      # the toolchain comes down from static.rust-lang.org as a download, not
      # a build, which keeps the cold cost bounded.
      - uses: Swatinem/rust-cache@v2

      # Warms the shell so a flake evaluation error is reported on its own
      # line rather than attributed to whichever gate happened to run first.
      - name: Build dev shell
        run: nix develop --command rustc --version

      - name: rustfmt
        run: nix develop --command cargo fmt --all --check

      - name: clippy (-D warnings)
        # `--exclude cabas-tauri` is not an oversight: on Linux that crate
        # links the desktop GUI stack, and no runner here has it. It is checked
        # for the target it ships to, by `tauri-check` in the `.#android`
        # shell — a local gate until M8 (see src-tauri/README.md).
        run: nix develop --command cargo clippy --locked --workspace --exclude cabas-tauri --all-targets -- -D warnings

      - name: tests
        run: nix develop --command cargo nextest run --locked --workspace --exclude cabas-tauri

      # Rule 9 — the frontend's types are generated from the Rust ones, never
      # hand-written. Regenerating them must be a no-op: a diff here means the
      # command or view surface moved and the committed `.ts` files did not,
      # which the frontend would discover as a type error at M4 or, worse, not
      # at all.
      - name: typescript bindings are up to date
        run: |
          nix develop --command cargo test --locked -p cabas-app \
            --features typescript export_bindings
          # Staged, then compared: a plain `git diff` would miss a *new* type,
          # whose file is untracked and therefore invisible to it — and a new
          # type is exactly the case where the frontend has not been told.
          git add --all ui/src/lib/bindings
          git diff --cached --exit-code ui/src/lib/bindings

      # Rule 8 — domain, store, sync and app must build for wasm32 at all
      # times. A regression here surfaces as a blank page on an iPhone, which
      # is the worst possible place to find it.
      - name: wasm32 build
        run: nix develop --command wasm-check --locked

      # Rule 13 — the wasm-bindgen crate and CLI must match exactly; a
      # mismatch fails at load time with no useful message.
      - name: wasm-bindgen version match
        run: nix develop --command check-wasm-bindgen

  # The two claims only a browser can settle: that a snapshot survives
  # IndexedDB, and that the app layer *runs* on wasm32 — a missing `getrandom`
  # web backend or a clock that panics are invisible natively and fatal on a
  # phone.
  #
  # A separate job because it needs a separate shell: chromium is a large
  # download that the everyday gates have no use for (DECISIONS 0013), and
  # keeping it here means a browser failure reads as a browser failure instead
  # of poisoning `fmt`.
  #
  # This is the only thing in CI that *executes* wasm. `wasm-check` proves the
  # shared crates compile for wasm32, which is a strictly weaker claim.
  wasm-storage:
    name: wasm in headless chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: Swatinem/rust-cache@v2
        with:
          # A different target and profile from the `gates` job; sharing one
          # cache key would make each job evict the other's artifacts.
          key: wasm-storage

      - name: wasm-bindgen-test
        run: nix develop .#wasm-test --command wasm-test --locked

  # The PWA: that it type-checks against the generated bindings, that it
  # builds, and that it actually works in a browser.
  #
  # Its own job because it spans both shells — the wasm core and the bundle are
  # built in the default one, and the end-to-end run needs the browser shell.
  # Splitting it further would mean building the core twice.
  frontend:
    name: pwa · types · build · browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: Swatinem/rust-cache@v2
        with:
          # wasm32 again, but the `wasm-release` profile rather than `dev` —
          # a third cache key, for the same reason `wasm-storage` has a second.
          key: frontend

      - name: install (frozen lockfile)
        run: nix develop --command pnpm -C ui install --frozen-lockfile

      # Before the type check, deliberately: `src/lib/core.ts` imports the
      # generated glue, so a missing wasm build reads as a missing module
      # rather than as the build step nobody ran.
      - name: build the wasm core
        run: nix develop --command build-wasm --locked

      # Rule 9 — the frontend is written against types generated from Rust. A
      # view-model field that moved must fail here, not on a phone.
      - name: svelte-check
        run: nix develop --command pnpm -C ui check

      - name: build the bundle
        run: nix develop --command pnpm -C ui build

      # The whole vertical in a real browser: identity, IndexedDB, the derived
      # cart, a cold reload, and sync. See `ui/tests/smoke.mjs`.
      #
      # After the bundle, and not only because it needs one to serve: `ui-test`
      # builds the relay, which compiles `ui/dist` into itself (DECISIONS
      # 0048), so this step is also what proves the shipped artifact — one
      # binary, one origin — actually serves an app.
      - name: end to end
        run: nix develop .#wasm-test --command ui-test

      # Handed to the `image` job rather than rebuilt there: `build-wasm` plus
      # `pnpm build` is the expensive half of this workflow, and the image must
      # contain *this* bundle — the one the browser suite just passed against —
      # and not a second build of the same commit.
      - name: keep the bundle for the image
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  # The add-on image (DECISIONS 0010, 0049): one static binary in a Home
  # Assistant base, cross-compiled here and never built on the Pi.
  #
  # It runs on every push and every PR, because the thing most likely to break
  # it is a change that has nothing to do with it — a dependency that stops
  # cross-compiling, a bundle that stops being embeddable. Publishing is the
  # narrow part, and the rules are in the `decide the tags` step.
  #
  # No qemu is installed, deliberately. The Dockerfile only copies, so
  # `--platform linux/arm64` needs no emulation; the day someone adds a `RUN`,
  # this fails loudly instead of quietly taking twenty minutes.
  image:
    name: add-on image · ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: frontend
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Raspberry Pi 4 running HAOS.
          - arch: aarch64
            platform: linux/arm64
          # A laptop — which is where the restore drill gets rehearsed.
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: Swatinem/rust-cache@v2
        with:
          # A fourth key: a musl target and the `release` profile, shared with
          # neither of the three above.
          key: image-${{ matrix.arch }}

      # The manifest against the workspace: the version that is the image tag,
      # and a base image for every architecture offered. Both fail on an
      # appliance otherwise, which is much later.
      - name: the add-on manifest agrees with the workspace
        run: nix develop --command check-addon

      - name: the bundle the browser suite passed against
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      # `CABAS_EMBED_UI=required` is set inside `build-relay`, so a bundle that
      # failed to arrive fails here rather than shipping an empty relay.
      - name: cross-compile the relay
        run: nix develop --command build-relay ${{ matrix.arch }}

      - uses: docker/setup-buildx-action@v3

      # What gets pushed, and from where:
      #
      #   pull request     build only — nothing is published from a fork or a
      #                    branch under review
      #   push to main     publish, but only a `-dev` version. A released
      #                    version must come from its tag, or a later push to
      #                    main would silently overwrite the image a release
      #                    named
      #   tag vX.Y.Z       publish `X.Y.Z` and move `latest`. The tag must
      #                    match the manifest's version — a release that
      #                    disagrees with itself is worse than no release
      - name: decide the image and its tags
        id: tags
        run: |
          set -euo pipefail
          version="$(grep -oP '^version:\s*"\K[^"]+' cabas-relay/config.yaml)"
          image="ghcr.io/${{ github.repository_owner }}/cabas-${{ matrix.arch }}"
          # The base image is read from build.yaml, never repeated here: it is
          # a pin someone will bump one day, and they will bump it there.
          # `check-addon` has already established that this arch has one.
          from="$(grep -oP '^\s+${{ matrix.arch }}:\s*\K\S+' cabas-relay/build.yaml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "from=$from" >> "$GITHUB_OUTPUT"
          # The commit's date, not now: rebuilding a commit should not produce
          # an image that claims to be newer than the one it replaces.
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=$image:pr" >> "$GITHUB_OUTPUT"
            echo "::notice::pull request — building $version for ${{ matrix.arch }}, publishing nothing"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            if [ "${{ github.ref_name }}" != "v$version" ]; then
              echo "::error::tag ${{ github.ref_name }} does not name the version in cabas-relay/config.yaml ($version)"
              exit 1
            fi
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "tags=$image:$version,$image:latest" >> "$GITHUB_OUTPUT"
          elif [ "${version%-dev}" != "$version" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "tags=$image:$version" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=$image:$version" >> "$GITHUB_OUTPUT"
            echo "::notice::$version is a release version — publish it from its vX.Y.Z tag, not from main"
          fi

      - uses: docker/login-action@v3
        if: steps.tags.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and publish
        uses: docker/build-push-action@v6
        with:
          context: cabas-relay
          file: cabas-relay/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ steps.tags.outputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BUILD_FROM=${{ steps.tags.outputs.from }}
            BUILD_VERSION=${{ steps.tags.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_REVISION=${{ steps.tags.outputs.revision }}
            BUILD_CREATED=${{ steps.tags.outputs.created }}

  # `main` must never advertise a version the appliance cannot pull.
  #
  # `cabas-relay/config.yaml`'s `version` is not a label: it is the image tag
  # the Supervisor pulls, and the Supervisor reads it off this repository's
  # default branch, continuously. So the moment a bump lands on `main`, every
  # installed add-on is offered that version — while only a `vX.Y.Z` tag
  # actually publishes an image.
  #
  # That gap stranded 0.6.1 for a day: bumped on main by a commit that was
  # never tagged, offered to the Pi, and impossible to pull. The `image` job
  # said so at the time — "publish it from its vX.Y.Z tag, not from main" —
  # as a `::notice::`, in a log nobody reads. A notice is not a gate, which is
  # the whole lesson: this job is the same statement, in red (DECISIONS 0075).
  #
  # It checks the **tag**, not the registry. If the tag exists, its own run
  # published the image or went red trying, and that run is the one to look
  # at; polling ghcr from here would just be a second place to be wrong about
  # what shipped.
  #
  # The tag is not required to point at HEAD. A docs commit landing on main
  # after a release leaves the version untouched and already published, which
  # is fine; what must never happen is a version with no tag anywhere.
  advertised-version:
    name: main advertises a released version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: the version on main has a tag
        run: |
          set -euo pipefail
          version="$(grep -oP '^version:\s*"\K[^"]+' cabas-relay/config.yaml)"

          if [ "${version%-dev}" != "$version" ]; then
            echo "::notice::$version is a development version — it publishes its own image from main"
            exit 0
          fi

          # A release is normally two pushes seconds apart — the branch, then
          # the tag — so this run can legitimately start before the tag ref
          # exists. Waiting a few minutes turns that race into a pass instead
          # of a red run on a correct release; a version that is genuinely
          # stranded is still stranded three minutes later.
          for attempt in $(seq 1 12); do
            if git ls-remote --tags --exit-code origin "refs/tags/v$version" >/dev/null 2>&1; then
              echo "::notice::v$version exists — main advertises a version that has a release"
              exit 0
            fi
            echo "no v$version yet (attempt $attempt/12), waiting for the tag push…"
            sleep 15
          done

          echo "::error::main advertises $version and no v$version tag exists."
          echo "::error::cabas-relay/config.yaml's version is the image tag the Supervisor pulls, so every"
          echo "::error::installed add-on is now offered $version — and nothing published it."
          echo "::error::Fix it by tagging this version: git tag -a v$version -F <changelog> && git push origin v$version"
          echo "::error::(or, if it was never meant to ship, move the version on and tag that one instead)."
          exit 1

  # The Android artifact (M7). **Not on every push**: this job realizes the
  # Android SDK and NDK through Nix and then lets `gradlew` fetch its own
  # Gradle and the whole AGP tree — several gigabytes and several minutes,
  # against a crate that changes when `crates/app/src/wasm.rs` changes and
  # not otherwise.
  #
  # It is also the CI coverage DECISIONS 0094 said this crate did not have.
  # 0094 is still right about the everyday gates — `cargo clippy --workspace`
  # excludes `cabas-tauri` because on Linux it links the desktop GUI stack —
  # but "nothing on a runner compiles it" stops being true here, on the two
  # events where it matters.
  apk:
    name: android apk
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      # The runner ships its own Android SDK, its own .NET and its own
      # Haskell, and this job needs none of them and the disk they sit on.
      # Without this the Nix closure plus `~/.gradle` runs the image out of
      # space, which surfaces as a Gradle error about nothing in particular.
      - name: make room
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: Swatinem/rust-cache@v2
        with:
          # A fifth key: the Android targets and their own dependency tree,
          # shared with none of the four above.
          key: apk

      # `gradlew` pins its own distribution and pulls the AGP and Kotlin trees
      # from google() and mavenCentral() — about 1.5 GB that Nix does not own
      # (see src-tauri/README.md). Cached on the wrapper properties and the
      # Gradle files, which is what decides both.
      - name: cache what gradle fetches for itself
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'src-tauri/gen/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: install (frozen lockfile)
        run: nix develop --command pnpm -C ui install --frozen-lockfile

      # No `build-wasm` here, and that is not an omission. `--mode tauri`
      # resolves `$core-host` to `core.tauri.ts`, so nothing in the graph
      # imports the wasm glue and the bundle builds without it (DECISIONS
      # 0093). The build below runs `beforeBuildCommand` itself.

      # The gate `cargo clippy --workspace` cannot be (DECISIONS 0094), run
      # before the expensive half so a type error does not cost a Gradle
      # download to discover.
      - name: clippy, for the target it ships to
        run: nix develop .#android --command tauri-check

      - name: build the apk
        working-directory: src-tauri
        run: nix develop ..#android --command cargo-tauri android build --debug --apk --target aarch64

      # Debug rather than release, because a release APK is unsigned until
      # there is a keystore to sign it with, and an unsigned APK cannot be
      # installed. See src-tauri/README.md, "Signing".
      - name: keep the apk
        uses: actions/upload-artifact@v4
        with:
          name: cabas-apk-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          retention-days: 30

  # The Android shell is not *built* on every push — `apk` above does that,
  # on a dispatch or a tag — but it must keep **evaluating** everywhere. A
  # flake that breaks at eval would otherwise be discovered the next time
  # somebody asks for an APK, which is exactly when they want one.
  android-shell-eval:
    name: android shell evaluates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix eval --raw .#devShells.x86_64-linux.android.name
