[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/store",
    "crates/sync",
    "crates/app",
    "crates/relay",
]

[workspace.package]
# Semver of the shipped artifact (CONSTITUTION Rule 15): `fix:` → patch,
# `feat:` → minor, a break in the sync protocol or the persisted schema →
# major, tooling-only changes bump nothing. It is not a commit counter, and
# it is not decoration either: the Supervisor decides an add-on has an update
# by comparing this string to the installed one, so anything that must reach
# the Pi has to move it.
version = "0.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexisjapas/cabas"

# Single version registry for the workspace. A crate references an entry with
# `dep.workspace = true` at the milestone that needs it, and pins nothing
# locally (Rule 13). Entries below are the *plan*: the exact version is
# confirmed against the registry when the milestone actually wires it in, so
# an unused line here is a note to self, not a resolved dependency.
[workspace.dependencies]

# --- internal crates ---
cabas-domain = { path = "crates/domain" }
cabas-store = { path = "crates/store" }
cabas-sync = { path = "crates/sync" }
cabas-app = { path = "crates/app" }

# --- M1 · domain ---
# Exact rational arithmetic for every quantity (Rule 4): scaling a recipe by
# 3/2 must stay exact, and 1/3 cup must render as 1/3. `num-bigint-std` is
# off: quantities are `Ratio<i128>`, which is the whole point of picking i128
# over i64 — imperial conversion factors are exact decimals with large
# denominators (1 oz = 28.349523125 g), and i64 products overflow on them.
num-rational = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# Property tests for the invariants the constitution states (Rule 11):
# scale∘aggregate == aggregate∘scale, conversions round-trip, DAG expansion
# terminates.
proptest = "1"

# --- M2 · store ---
# CRDT. Confined to `store` and never exposed (Rule 2) — this entry is the
# only place in the workspace that may name it.
loro = "1"
# `std::time::Instant` panics on wasm32; `web-time` is the drop-in that makes
# `app` build for both targets (Rule 8).
web-time = "1"

# --- M2 · the IndexedDB storage backend (wasm32 only) ---
#
# Arrived a milestone earlier than planned: the `Storage` trait needs a wasm
# implementation to be worth anything, and IndexedDB is the only durable
# store an installed PWA has (DECISIONS 0003, 0008).
#
# `wasm-bindgen`'s version MUST equal the `wasm-bindgen-cli` the flake
# provides, or the generated glue fails at load time with no useful message;
# `check-wasm-bindgen` enforces it in CI (Rule 13). Pinned exactly.
#
# The pin propagates: `js-sys`, `web-sys` and `wasm-bindgen-test` each depend
# on an *exact* `wasm-bindgen`, so bumping any of them can drag the lockfile
# off the CLI version even though nothing here changed. That is why
# `check-wasm-bindgen` reads `Cargo.lock` and not only this file.
wasm-bindgen = "=0.2.121"
js-sys = "0.3"
# Bridges a JS promise to a Rust future — every IndexedDB operation completes
# on a later turn of the event loop and has no blocking form.
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "DomException",
    "DomStringList",
    "Event",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
] }
# Runs `#[wasm_bindgen_test]` cases in a real headless browser. There is no
# other honest way to test IndexedDB: it does not exist outside one.
wasm-bindgen-test = "0.3"

# --- M3 · app (wasm + native surfaces) ---
serde-wasm-bindgen = "0.6"
# Generates the frontend's TypeScript types from the Rust ones (Rule 9: the
# types are generated, never hand-written). Optional, behind `cabas-app`'s
# `typescript` feature, so nothing of it reaches the shipped wasm: it exists
# to run `cargo test --features typescript` and write `.ts` files.
ts-rs = "12"
# Needs the web backend feature on wasm32, otherwise key generation fails to
# link. Required by the M5 crypto.
getrandom = "0.3"

# --- M5 · sync (E2EE + transport) ---
# Default features off: they pull `rand_core` 0.6, whose `getrandom` 0.2
# needs a *second* wasm opt-in (`js`) on top of the 0.3 one this workspace
# already carries. Nonces come from `getrandom` 0.3 directly instead, so one
# randomness backend serves the whole workspace (Rule 8).
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# 12-word recovery phrase: the mandatory fallback to QR pairing, because the
# camera is historically brittle in an installed iOS PWA (DECISIONS 0021).
# The mnemonic is the single canonical secret — key and family id are both
# derived from its seed, and no argon2: 128 machine-generated bits need no
# stretching (DECISIONS 0042).
bip39 = "2"
# The wire codec for the device↔relay messages: serde-native, binary, no_std.
# The payloads are ciphertext, so a self-describing format would describe
# nothing (DECISIONS 0042).
postcard = { version = "1", default-features = false, features = ["use-std"] }
# The native transport, and the socket the convergence test drives. There is
# no wasm counterpart to pin: `Session` is sans-IO, and on the PWA the
# WebSocket is the browser's own, owned by the frontend (DECISIONS 0043).
futures = "0.3"
tokio-tungstenite = "0.24"

# --- M5/M6 · relay ---
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = "0.8"
tower-http = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
# `rust-embed` was the plan for compiling the PWA into the relay and is not
# used: its derive needs the folder to exist at compile time, and `ui/dist`
# is a gitignored build product, so a fresh checkout could not run `cargo
# clippy --workspace` until someone had run `pnpm build`. `crates/relay/
# build.rs` writes the table instead — one `include_bytes!` per file, no
# dependency, and an empty table when there is no bundle (DECISIONS 0048).

[profile.release]
lto = true
codegen-units = 1
strip = true

# Size-first profile for the wasm core: on the PWA the download is the cost
# that matters, not the last few percent of speed.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
