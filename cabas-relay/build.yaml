# Base images, per architecture.
#
# This file is the Home Assistant builder's contract. CI does not use that
# builder — it cross-compiles on the runner and calls `docker buildx` itself
# (DECISIONS 0049) — but the values live here rather than in the workflow
# because this is where anyone looking for them will look, and because a
# `docker build` run by hand should produce the same image CI does.
#
# Alpine 3.21, pinned. `latest` would mean the image changes under us on a
# rebuild of an unchanged commit, which is the one thing a release tag is
# supposed to prevent.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.21
  amd64: ghcr.io/home-assistant/amd64-base:3.21

labels:
  org.opencontainers.image.source: https://github.com/alexisjapas/cabas
  org.opencontainers.image.licenses: MIT OR Apache-2.0
