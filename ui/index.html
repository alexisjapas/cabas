<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />

    <!--
      `viewport-fit=cover` is what makes `env(safe-area-inset-*)` mean
      anything: without it iOS letterboxes the page and the notch insets all
      read zero. `user-scalable=no` is deliberately absent — pinch-zoom is an
      accessibility feature, and the layout does not need to forbid it.

      It is also not how the automatic zoom towards a focused field is
      stopped: `maximum-scale=1` would take pinch-zoom with it. `app.css`
      floors every control at 16px instead, which is the size iOS reads
      (DECISIONS 0078).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      Standalone display when launched from the home screen. The `apple-`
      variant is the one iOS actually reads; the unprefixed one is the
      standard every other browser reads (DECISIONS 0003).
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="cabas" />

    <!--
      One colour, because there is one theme: the apricot the shell is painted
      in (DECISIONS 0081). The status bar matches the page rather than fighting
      it, and a dark variant would repaint it under an app that has no dark
      version.
    -->
    <meta name="theme-color" content="#f9c77e" />

    <!--
      The browser-tab icon. Its absence is a 404 that `ui-test` treats as a
      failure — correctly, for an app whose whole point is loading with no
      network.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      The manifest is what makes the app installable everywhere except iOS,
      which reads the `apple-` meta tags above instead — but names its home
      screen icon here, as a PNG, because it does not read SVG for that. The
      other sizes and the maskable variant are in the manifest.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!--
      The two faces, self-hosted and preloaded. The screen title is the first
      thing painted, so a swap that lands after the first render moves the whole
      page; and `crossorigin` is not optional on a font preload — without it the
      browser fetches the file twice and uses neither copy for the other.

      They are also in the service worker's precache list (`vite.config.ts`),
      because `public/` does not go through the bundle and a font fetched at
      runtime is a font that is missing on the first launch in a shop.
    -->
    <link
      rel="preload"
      href="/fonts/shrikhand-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/quicksand-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>cabas</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
